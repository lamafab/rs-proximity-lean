name = "rsproximity"
defaultTargets = ["RsProximity", "Example"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0-rc1"

[[lean_lib]]
name = "RsProximity"

[[lean_lib]]
name = "Example"
globs = ["Example.ParametersDemo", "Example.DistanceDemo", "Example.GF8", "Example.FoldDemo"]
